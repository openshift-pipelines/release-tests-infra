apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: release-ui-tests
spec:
  workspaces:
    - name: release-ui-tests-git
    - name: results
  params:
  - name: CLUSTER_NAME
  - name: FAIL_ON_ERROR
    default: "true"
  - name: IMAGE
    description: Container image for running UI tests (Playwright + pytest)
    default: quay.io/openshift-pipeline/ui-ci:latest
  - name: API_URL
    description: OpenShift API URL (required by the UI framework)
    default: ""
  - name: CONSOLE_URL
    description: OpenShift console URL (required by the UI framework)
    default: ""
  - name: CONSOLE_USERNAME
    description: Console login username passed to the UI framework
    default: kubeadmin
  - name: OPERATOR_VERSION
    description: OSP version passed to the UI framework for install
    default: ""
  - name: OPERATOR_ENVIRONMENT
    description: prod / stage / pre-stage — passed to the UI framework
    default: pre-stage
  - name: CHANNEL
    description: OLM channel passed to the UI framework
    default: ""
  - name: KONFLUX_INDEX_IMAGE
    description: Konflux index image URL passed to the UI framework
    default: ""
  - name: INSTALL_PIPELINES_OPERATOR
    description: Whether the UI framework should install OSP (framework default false)
    default: "false"
  - name: OSP_INSTALL_METHOD
    description: How the UI framework installs OSP (framework default ui)
    default: "ui"
  - name: INSTALL_LOGGING_OPERATOR
    description: Passed to the UI framework (noop until framework implements it)
    default: "false"
  - name: INSTALL_SERVERLESS_OPERATOR
    description: Passed to the UI framework (noop until framework implements it)
    default: "false"
  - name: MARKERS
    description: pytest marker expression (e.g. sanity, smoke)
    default: sanity
  - name: PYTEST_ARGS
    description: Extra arguments passed to pytest
    default: ""
  - name: APP_TIMEOUT
    description: Application timeout for element waits (ms)
    default: "90000"
  - name: AUTH_TYPE
    description: Console authentication mode passed to pytest (e.g. kube:admin)
    default: "kube:admin"
  - name: CAPTURE_SCREENSHOTS
    description: Capture Playwright screenshots on failure
    default: "true"
  - name: CAPTURE_RECORDINGS
    description: Enable Playwright video recording during tests
    default: "true"
  - name: UPLOAD_RECORDINGS_ON_FAILURE
    description: Upload .webm recordings to GCS only when tests fail (requires CAPTURE_RECORDINGS=true)
    default: "false"
  steps:
    - name: run
      image: $(params.IMAGE)
      workingDir: $(workspaces.release-ui-tests-git.path)
      env:
        - name: ADMIN_NAME
          valueFrom:
            secretKeyRef:
              key: admin-name
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: kubeadmin-password
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              key: admin-token
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: APISERVER
          valueFrom:
            secretKeyRef:
              key: api-url
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: TASKRUN_NAME
          value: $(context.taskRun.name)
        - name: TASKRUN_NAMESPACE
          value: $(context.taskRun.namespace)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        RESULTS_DIR="$(workspaces.results.path)"
        ARTIFACTS_DIR="${RESULTS_DIR}/ui-artifacts"
        mkdir -p "$ARTIFACTS_DIR"

        taskRunName="${TASKRUN_NAME}"
        status=fail

        upload_recordings_on_failure() {
          case "$(printf '%s' "$(params.UPLOAD_RECORDINGS_ON_FAILURE)" | tr '[:upper:]' '[:lower:]')" in
            true|1|yes|on) return 0 ;; *) return 1 ;;
          esac
        }

        save_results() {
          echo "${taskRunName}: ${status}" > "${RESULTS_DIR}/${taskRunName}.result"
          # Framework writes under ARTIFACTS_DIR/screenshots/*.png and ARTIFACTS_DIR/recordings/*.webm
          # Flatten into results root so upload-artifacts-gcs picks up *.png / *.webm
          if [[ -d "$ARTIFACTS_DIR" ]]; then
            upload_webm=false
            if upload_recordings_on_failure && [[ "$status" == "fail" ]]; then
              upload_webm=true
            fi
            while IFS= read -r -d '' f; do
              [[ -f "$f" ]] || continue
              if [[ "$f" == *.webm ]] && [[ "$upload_webm" != true ]]; then
                continue
              fi
              base="$(basename "$f")"
              dest="${RESULTS_DIR}/${base}"
              if [[ -e "$dest" ]]; then
                parent="$(basename "$(dirname "$f")")"
                dest="${RESULTS_DIR}/${parent}-${base}"
              fi
              cp -f "$f" "$dest"
            done < <(find "$ARTIFACTS_DIR" -type f \( -iname '*.png' -o -iname '*.webm' \) -print0 2>/dev/null)
            if [[ "$upload_webm" != true ]]; then
              if upload_recordings_on_failure; then
                echo "Tests passed — skipping recording upload (screenshots only if present)"
              else
                echo "UPLOAD_RECORDINGS_ON_FAILURE=false — skipping recording upload"
              fi
            fi
          fi
        }
        trap 'save_results' EXIT

        resolved=$(oc get taskrun "${TASKRUN_NAME}" -n "${TASKRUN_NAMESPACE}" \
          -o json 2>/dev/null | jq -r '.metadata.labels["tekton.dev/pipelineTask"] // empty' || true)
        [[ -n "$resolved" ]] && taskRunName="$resolved"
        echo "Resolved pipelineTask name: ${taskRunName}"

        export API_URL="$(params.API_URL)"
        API_URL="${API_URL:-${APISERVER:-}}"
        export API_URL
        [[ -n "${API_URL}" ]] || {
          echo "ERROR: API_URL is required (set in env / PipelineRun param, or api-url in cluster secret)"
          exit 1
        }

        ADMIN_NAME=${ADMIN_NAME:-$(params.CONSOLE_USERNAME)}
        ADMIN_NAME=${ADMIN_NAME:-kubeadmin}
        if [[ -n "${ADMIN_PASSWORD:-}" ]]; then
          echo "Logging in to cluster $(params.CLUSTER_NAME) as '${ADMIN_NAME}'"
          oc login -u "$ADMIN_NAME" -p "$ADMIN_PASSWORD" "$API_URL" --insecure-skip-tls-verify=true
        elif [[ -n "${ADMIN_TOKEN:-}" ]]; then
          echo "Logging in to cluster $(params.CLUSTER_NAME) with token"
          oc login --token="$ADMIN_TOKEN" "$API_URL" --insecure-skip-tls-verify=true
        else
          echo "ERROR: no credentials — set kubeadmin-password or admin-token in cluster secret"
          exit 1
        fi

        export CONSOLE_URL="$(params.CONSOLE_URL)"
        if [[ -z "${CONSOLE_URL}" ]]; then
          CONSOLE_URL="$(oc whoami --show-console 2>/dev/null || true)"
        fi
        [[ -n "${CONSOLE_URL}" ]] || {
          echo "ERROR: CONSOLE_URL is required (set in env / PipelineRun param)"
          exit 1
        }
        export CONSOLE_USERNAME="$(params.CONSOLE_USERNAME)"
        CONSOLE_USERNAME="${CONSOLE_USERNAME:-${ADMIN_NAME}}"
        export CONSOLE_USERNAME
        export CONSOLE_PASSWORD="${ADMIN_PASSWORD:-}"
        export APP_TIMEOUT="$(params.APP_TIMEOUT)"
        export AUTH_TYPE="$(params.AUTH_TYPE)"
        export CAPTURE_SCREENSHOTS="$(params.CAPTURE_SCREENSHOTS)"
        export CAPTURE_RECORDINGS="$(params.CAPTURE_RECORDINGS)"
        export ARTIFACTS_DIR

        # Infra installs OSP today; PipelineRun should pass INSTALL_PIPELINES_OPERATOR=false.
        # Logging/serverless flags are forwarded for framework use when implemented.
        export OPERATOR_VERSION="$(params.OPERATOR_VERSION)"
        export OPERATOR_ENVIRONMENT="$(params.OPERATOR_ENVIRONMENT)"
        export CHANNEL="$(params.CHANNEL)"
        export KONFLUX_INDEX_IMAGE="$(params.KONFLUX_INDEX_IMAGE)"
        export INSTALL_PIPELINES_OPERATOR="$(params.INSTALL_PIPELINES_OPERATOR)"
        export OSP_INSTALL_METHOD="$(params.OSP_INSTALL_METHOD)"
        export INSTALL_LOGGING_OPERATOR="$(params.INSTALL_LOGGING_OPERATOR)"
        export INSTALL_SERVERLESS_OPERATOR="$(params.INSTALL_SERVERLESS_OPERATOR)"

        echo "API_URL=${API_URL}"
        echo "CONSOLE_URL=${CONSOLE_URL}"
        echo "CONSOLE_USERNAME=${CONSOLE_USERNAME}"
        echo "ARTIFACTS_DIR=${ARTIFACTS_DIR}"
        echo "AUTH_TYPE=${AUTH_TYPE}"
        echo "OPERATOR_VERSION=${OPERATOR_VERSION}  ENVIRONMENT=${OPERATOR_ENVIRONMENT}  CHANNEL=${CHANNEL}"
        echo "INSTALL_PIPELINES_OPERATOR=${INSTALL_PIPELINES_OPERATOR}  OSP_INSTALL_METHOD=${OSP_INSTALL_METHOD}"
        echo "INSTALL_LOGGING_OPERATOR=${INSTALL_LOGGING_OPERATOR}"
        echo "INSTALL_SERVERLESS_OPERATOR=${INSTALL_SERVERLESS_OPERATOR}"
        echo "Markers: $(params.MARKERS)"

        [[ -d tests ]] || { echo "ERROR: release-ui-tests repo not ready (missing tests/)"; ls -la; exit 1; }

        LOG_FILE="${RESULTS_DIR}/${taskRunName}.log"
        {
          echo "=== release-ui-tests ==="
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "pipelineTask: ${taskRunName}"
          echo "markers: $(params.MARKERS)"
          echo "auth_type: ${AUTH_TYPE}"
          echo "OPERATOR_VERSION: ${OPERATOR_VERSION}"
          echo "OPERATOR_ENVIRONMENT: ${OPERATOR_ENVIRONMENT}"
          echo "CHANNEL: ${CHANNEL}"
          echo "KONFLUX_INDEX_IMAGE: ${KONFLUX_INDEX_IMAGE}"
          echo "INSTALL_PIPELINES_OPERATOR: ${INSTALL_PIPELINES_OPERATOR}"
          echo "OSP_INSTALL_METHOD: ${OSP_INSTALL_METHOD}"
          echo "INSTALL_LOGGING_OPERATOR: ${INSTALL_LOGGING_OPERATOR}"
          echo "INSTALL_SERVERLESS_OPERATOR: ${INSTALL_SERVERLESS_OPERATOR}"
          echo "API_URL: ${API_URL}"
          echo "CONSOLE_URL: ${CONSOLE_URL}"
          echo "Command: pytest -m $(params.MARKERS) $(params.PYTEST_ARGS)"
          echo "---"
        } > "$LOG_FILE"

        set +e
        # shellcheck disable=SC2086
        pytest -m "$(params.MARKERS)" $(params.PYTEST_ARGS) \
          --junitxml="${RESULTS_DIR}/${taskRunName}.xml" \
          2>&1 | tee -a "$LOG_FILE"
        exit_code=${PIPESTATUS[0]}
        set -e

        {
          echo "---"
          echo "Finished: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "pytest exit code: ${exit_code}"
        } >> "$LOG_FILE"

        if [[ $exit_code -eq 0 ]]; then
          status=pass
        else
          status=fail
          echo "pytest exited with code ${exit_code} (see ${LOG_FILE})"
          if [[ "$(params.FAIL_ON_ERROR)" == "true" || "$(params.FAIL_ON_ERROR)" == "True" ]]; then
            exit "$exit_code"
          fi
        fi
