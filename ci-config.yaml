---
# Version-to-branch mapping for release-tests-infra workflows.
#
# OpenShift Pipelines operator keys (major.minor, e.g. "1.23"):
#   Used by create-pipelinerun.sh / run-upgrade-tests.sh from OPERATOR_VERSION.
#   channel, release-tests.revision, release-tests-ginkgo.revision (optional)
#
# OpenShift cluster keys (major.minor, e.g. "4.20"):
#   Used by create-pipelinerun-ui.sh from OCP version (OPENSHIFT_VERSION or oc).
#   release-ui-tests.revision
#
# Explicit .env values always override ci-config.yaml defaults.
#
# --- OpenShift Pipelines operator versions ---
'1.14':
  channel: pipelines-1.14
  release-tests:
    revision: release-v1.14
'1.15':
  channel: pipelines-1.15
  release-tests:
    revision: release-v1.15
'1.16':
  channel: pipelines-1.16
  release-tests:
    revision: release-v1.16
'1.17':
  channel: pipelines-1.17
  release-tests:
    revision: release-v1.17
'1.18':
  channel: pipelines-1.18
  release-tests:
    revision: release-v1.18
'1.19':
  channel: pipelines-1.19
  release-tests:
    revision: release-v1.19
'1.20':
  channel: pipelines-1.20
  release-tests:
    revision: release-v1.20
'1.21':
  channel: pipelines-1.21
  release-tests:
    revision: release-v1.21
'1.22':
  channel: pipelines-1.22
  release-tests:
    revision: release-v1.22
'1.23':
  channel: pipelines-1.23
  release-tests:
    revision: release-v1.23
  release-tests-ginkgo:
    revision: main
'1.24':
  channel: pipelines-1.24
  release-tests:
    revision: release-v1.24
  release-tests-ginkgo:
    revision: main
'5.0':
  channel: pipelines-5.0
  release-tests:
    revision: master
  release-tests-ginkgo:
    revision: main

# --- OpenShift cluster versions (release-ui-tests branches) ---
'4.14':
  release-ui-tests:
    revision: release-v4.14
'4.16':
